name: Site Maintenance (monitor, fix, verified redeploy)

on:
  schedule:
    # Daily at 03:17 UTC — off-peak, off the exact hour on purpose
    - cron: '17 3 * * *'
  workflow_dispatch: {}

concurrency:
  group: site-maintenance
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    outputs:
      issues_found: ${{ steps.check.outputs.issues_found }}
    steps:
      - uses: actions/checkout@v4

      - name: Run site monitor
        id: run_monitor
        run: |
          set +e
          python3 scripts/monitor_site.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Set issues_found output
        id: check
        run: |
          if [ "${{ steps.run_monitor.outputs.exit_code }}" = "0" ]; then
            echo "issues_found=false" >> "$GITHUB_OUTPUT"
          else
            echo "issues_found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload monitor report
        if: steps.check.outputs.issues_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: monitor-report
          path: monitor-report.txt

  fix:
    needs: monitor
    if: needs.monitor.outputs.issues_found == 'true'
    runs-on: ubuntu-latest
    outputs:
      commit_made: ${{ steps.check_commit.outputs.commit_made }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download monitor report
        uses: actions/download-artifact@v4
        with:
          name: monitor-report

      - name: Record starting commit
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code to fix reported issues
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}

            The automated site monitor for https://www.mosaichostels.com found
            the following issues (also available in monitor-report.txt):

            $(cat monitor-report.txt)

            Fix these issues in the codebase. Hard constraints:
            - Do not modify deploy.sh's credential-handling (the FTP_HOST/
              FTP_USER/FTP_PASS environment-variable checks) or anything
              under .github/workflows/.
            - Do not fabricate business claims, reviews, ratings, testimonials,
              or any factual content you cannot verify from the existing repo.
              If a fix needs information you don't have, leave a clear comment
              explaining what's needed instead of guessing.
            - Only touch files relevant to the reported issues — no unrelated
              refactoring or cleanup.
            - Validate any JSON-LD you touch actually parses as valid JSON
              before committing.
            - Commit your changes directly to this branch with a clear,
              specific commit message describing what was fixed and why.
              If you determine no safe fix is possible, make no commit and
              explain why in the step output instead.
          claude_args: |
            --max-turns 15
            --allowedTools Read,Edit,Write,Grep,Glob

      - name: Check whether a fix commit was made
        id: check_commit
        run: |
          AFTER=$(git rev-parse HEAD)
          if [ "${{ steps.before.outputs.sha }}" != "$AFTER" ]; then
            echo "commit_made=true" >> "$GITHUB_OUTPUT"
          else
            echo "commit_made=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push fix commit
        if: steps.check_commit.outputs.commit_made == 'true'
        run: git push origin HEAD:main

  deploy:
    needs: fix
    if: needs.fix.outputs.commit_made == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy to production
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: bash deploy.sh all

      - name: Verify deploy (live-vs-local + health checks)
        id: verify
        run: |
          set +e
          python3 scripts/monitor_site.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Roll back to last-known-good on verification failure
        if: steps.verify.outputs.exit_code != '0'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          echo "Verification failed post-deploy — rolling back to previous commit"
          git checkout HEAD~1 -- .
          bash deploy.sh all

      - name: Open an issue if verification/rollback was needed
        if: steps.verify.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Site maintenance: auto-fix failed verification, rolled back (${new Date().toISOString().slice(0,10)})`,
              body: `The scheduled site-maintenance workflow's auto-fix commit failed post-deploy verification and was rolled back to the last known-good state.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThe fix commit is still on \`main\` for review — investigate before re-deploying manually.`
            })
